<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>마인드맵 · 뉴리의창고</title>
<script>
  // 사이트와 같은 테마 (기본 다크, 사이트에서 바꾼 값이 있으면 그걸 따른다)
  try { document.documentElement.dataset.theme = localStorage.getItem("theme") === "light" ? "light" : "dark" } catch (e) { document.documentElement.dataset.theme = "dark" }
</script>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 뉴리의창고 토큰 (quartz.config.yaml · custom.scss 와 같은 값) */
  :root {
    --light: #1d1915; --lightgray: #3a322a; --gray: #b3a690; --darkgray: #e6dccb; --dark: #f6eee1;
    --accent: #d9ab72;
    --panel: rgba(29, 25, 21, 0.86);
    --line: rgba(240, 225, 200, 0.11);
    --dot: rgba(240, 225, 200, 0.07);
    --card-shadow: 0 18px 50px -12px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.25);
    --bodyFont: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --headerFont: "Gaegu", "Pretendard Variable", cursive;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --light: #fbf6ec; --lightgray: #ece2d0; --gray: #7a6a57; --darkgray: #43382c; --dark: #2b221a;
    --accent: #a35f1f;
    --panel: rgba(251, 246, 236, 0.88);
    --line: rgba(90, 60, 30, 0.14);
    --dot: rgba(90, 60, 30, 0.10);
    --card-shadow: 0 18px 44px -14px rgba(90, 55, 20, 0.28), 0 2px 6px rgba(90, 55, 20, 0.10);
    color-scheme: light;
  }

  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background-color: var(--light);
    /* 스케치북 같은 점 모눈: 손그림 마인드맵이 놓인 종이 */
    background-image: radial-gradient(var(--dot) 1.2px, transparent 1.3px);
    background-size: 22px 22px;
    color: var(--darkgray);
    font: 500 15px/1.5 var(--bodyFont);
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }
  svg { display: block; flex: none; }

  #stage { position: fixed; inset: 0; cursor: grab; touch-action: none; }
  #stage.drag { cursor: grabbing; }
  #pic {
    position: absolute; left: 0; top: 0; user-select: none; -webkit-user-drag: none;
    border-radius: 14px; background: #fff; box-shadow: var(--card-shadow);
    opacity: 0; transition: opacity 0.35s var(--ease-out);
  }
  #pic.is-ready { opacity: 1; }

  /* 떠 있는 판: 그림 위에서도 읽히게 옅은 바탕 + 흐림 */
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(10px) saturate(1.1);
    backdrop-filter: blur(10px) saturate(1.1);
    box-shadow: 0 6px 20px -8px rgba(0, 0, 0, 0.35);
  }

  /* ── 위: 사이트 이름 · 그림 제목 / 노트로 돌아가기 ── */
  .top {
    position: fixed; z-index: 3; top: 14px; left: 14px; right: 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    pointer-events: none;
  }
  .top > * { pointer-events: auto; }
  .where {
    display: flex; align-items: center; gap: 12px; min-width: 0;
    padding: 6px 16px 6px 8px; border-radius: 999px;
  }
  .brand {
    display: flex; align-items: center; gap: 8px; flex: none;
    color: var(--dark); text-decoration: none;
    font: 700 1.3rem/1 var(--headerFont);
    border-radius: 999px; padding: 2px 4px; min-height: 44px; min-width: 44px; box-sizing: border-box;
  }
  .brand img { width: 30px; height: 30px; }
  .sep { width: 1px; height: 18px; background: var(--line); flex: none; }
  .title {
    margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--darkgray); font: 700 1.25rem/1.1 var(--headerFont);
  }

  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    min-height: 40px; padding: 0 16px; border-radius: 999px;
    color: var(--darkgray); font: 600 0.9rem/1 var(--bodyFont); text-decoration: none;
    cursor: pointer; white-space: nowrap;
    transition: color 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
  }
  .pill svg { color: var(--accent); }

  /* ── 아래: 확대 도구 ── */
  .dock {
    position: fixed; z-index: 3; left: 50%; bottom: max(16px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 2px; padding: 5px; border-radius: 999px;
  }
  .tool {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-width: 40px; height: 40px; padding: 0 10px; border: 0; border-radius: 999px;
    background: transparent; color: var(--darkgray);
    font: 600 0.88rem/1 var(--bodyFont); text-decoration: none; cursor: pointer;
    transition: color 0.2s ease, background-color 0.2s ease;
  }
  .tool svg { color: currentColor; }
  #zoom {
    min-width: 54px; text-align: center; color: var(--gray);
    font: 600 0.84rem/1 var(--bodyFont); font-variant-numeric: tabular-nums;
  }
  .dock .sep { margin: 0 6px; }

  @media (hover: hover) and (pointer: fine) {
    .tool:hover, .pill:hover { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--panel)); }
    .brand:hover { color: var(--accent); }
  }
  :is(a, button):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 처음 몇 초만 보이는 사용법 */
  .hint {
    position: fixed; z-index: 2; left: 50%; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 62px);
    transform: translateX(-50%);
    margin: 0; padding: 7px 14px; border-radius: 999px; white-space: nowrap;
    color: var(--gray); font-size: 0.82rem;
    transition: opacity 0.4s var(--ease-out), transform 0.4s var(--ease-out);
  }
  .hint.is-gone { opacity: 0; transform: translate(-50%, 6px); pointer-events: none; }
  .hint .touch { display: none; }
  @media (pointer: coarse) { .hint .mouse { display: none; } .hint .touch { display: inline; } }

  /* 불러오는 중 · 실패 */
  #msg {
    position: fixed; inset: 0; z-index: 1; display: grid; place-items: center; align-content: center; gap: 14px;
    color: var(--gray); font-size: 0.95rem; text-align: center; padding: 0 24px;
  }
  #msg img { width: 64px; height: 64px; margin: 0 auto; }
  @media (prefers-reduced-motion: no-preference) {
    #msg img { animation: breathe 2.4s ease-in-out infinite; transform-origin: 50% 90%; }
  }
  @keyframes breathe { 50% { transform: scale(1.04, 0.97); } }

  /* 좁은 화면: 사이트 이름은 얼굴만, 돌아가기는 아이콘만 */
  @media (max-width: 640px) {
    .top { top: 10px; left: 10px; right: 10px; }
    .brand span, .back-text { display: none; }
    .where { padding-right: 14px; gap: 10px; }
    .pill { padding: 0 12px; }
    .hint { font-size: 0.78rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    #pic, .hint { transition-duration: 0.01s; }
  }
</style>
</head>
<body>
<div id="stage"><img id="pic" alt="마인드맵" draggable="false"></div>

<div id="msg" role="status"><img src="nyuri.svg" alt=""><span id="msgText">마인드맵을 펼치는 중이에요</span></div>

<header class="top">
  <div class="where panel">
    <a class="brand" id="home" href="../" aria-label="뉴리의창고 처음으로"><img src="nyuri.svg" alt=""><span>뉴리의창고</span></a>
    <span class="sep" aria-hidden="true"></span>
    <h1 class="title" id="title">마인드맵</h1>
  </div>
  <a class="pill panel" id="back" href="../" aria-label="노트로 돌아가기">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
    <span class="back-text">노트로 돌아가기</span>
  </a>
</header>

<p class="hint panel" id="hint">
  <span class="mouse">끌어서 옮기고, 휠로 확대해요. 두 번 누르면 그 자리를 크게 봐요.</span>
  <span class="touch">끌어서 옮기고, 두 손가락으로 확대해요.</span>
</p>

<nav class="dock panel" aria-label="확대 도구">
  <button class="tool" id="out" type="button" aria-label="축소" title="축소 (-)">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>
  </button>
  <span id="zoom" aria-live="polite">100%</span>
  <button class="tool" id="in" type="button" aria-label="확대" title="확대 (+)">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
  </button>
  <span class="sep" aria-hidden="true"></span>
  <button class="tool" id="fit" type="button" title="화면에 맞추기 (0)">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    <span>맞추기</span>
  </button>
  <a class="tool" id="raw" target="_blank" rel="noopener" title="원본 그림을 새 탭에서 열기">
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
    <span>원본</span>
  </a>
</nav>

<script>
(() => {
  // Quartz SPA 전환으로 들어오면 주소가 아직 이전 페이지라 파라미터를 못 읽는다 → 주소 갱신 뒤 새로고침
  if (!/\/static\/viewer\.html$/.test(location.pathname)) {
    setTimeout(() => { if (/\/static\/viewer\.html$/.test(location.pathname)) location.reload(); }, 50);
    return;
  }
  const qs = new URLSearchParams(location.search);
  const siteRoot = location.href.replace(/static\/viewer\.html.*$/, "");
  const src = qs.get("src");
  const back = qs.get("back");
  const img = document.getElementById("pic"), stage = document.getElementById("stage");
  const msg = document.getElementById("msg"), msgText = document.getElementById("msgText");
  const zoomEl = document.getElementById("zoom"), hint = document.getElementById("hint");
  const backEl = document.getElementById("back");
  document.getElementById("home").href = siteRoot;
  if (back) backEl.href = new URL(back, siteRoot).href;
  else { backEl.querySelector(".back-text").textContent = "처음으로"; backEl.setAttribute("aria-label", "처음으로"); }
  // 노트에서 새 창으로 열렸으면 이 창을 닫아 원래 노트로 돌아간다 (닫을 수 없으면 링크로 이동)
  backEl.addEventListener("click", e => {
    if (history.length > 1) return;
    e.preventDefault();
    window.close();
    setTimeout(() => { location.href = backEl.href; }, 200);
  });
  if (qs.get("title")) {
    document.getElementById("title").textContent = qs.get("title");
    document.title = qs.get("title") + " · 뉴리의창고";
  }
  if (!src) { msgText.textContent = "보여 줄 그림이 지정되지 않았어요. 노트에서 마인드맵 링크를 다시 눌러 주세요."; return; }
  const url = new URL(src, siteRoot).href;
  document.getElementById("raw").href = url;

  let natW = 1, natH = 1, z = 1, x = 0, y = 0;
  const MIN = 0.05, MAX = 8;
  // width/height 를 직접 바꿔서 벡터를 다시 그리게 함 (확대해도 선명)
  const apply = () => {
    img.style.width = natW * z + "px"; img.style.height = natH * z + "px";
    img.style.left = x + "px"; img.style.top = y + "px";
    zoomEl.textContent = Math.round(z * 100) + "%";
  };
  // 위 막대와 아래 도구를 피해서 화면에 맞춘다
  const fit = () => {
    const side = innerWidth < 640 ? 14 : 40, topGap = 76, bottomGap = 84;
    const W = innerWidth - side * 2, H = innerHeight - topGap - bottomGap;
    z = Math.min(W / natW, H / natH);
    x = (innerWidth - natW * z) / 2; y = topGap + (H - natH * z) / 2;
    apply();
  };
  const zoomAt = (factor, cx, cy) => {
    const nz = Math.min(MAX, Math.max(MIN, z * factor)); const k = nz / z;
    x = cx - (cx - x) * k; y = cy - (cy - y) * k; z = nz; apply();
  };

  // 사용법은 처음 한 번, 만지기 시작하거나 몇 초 지나면 사라진다
  let hintTimer = 0;
  const hideHint = () => { clearTimeout(hintTimer); hint.classList.add("is-gone"); };
  hint.classList.add("is-gone");

  // SVG 를 먼저 시도하고, 실패하거나 너무 오래 걸리면 PNG 로 대체
  const fbSrc = qs.get("fallback") || (/\.svg$/i.test(src) ? src.replace(/\.svg$/i, ".png") : null);
  const fallback = fbSrc ? new URL(fbSrc, siteRoot).href : null;
  let usingFallback = false, done = false;
  const useFallback = why => {
    if (usingFallback || !fallback) {
      if (!done) msgText.textContent = "그림을 불러오지 못했어요. 새로고침하거나 아래 ‘원본’을 눌러 주세요.";
      return;
    }
    usingFallback = true; msgText.textContent = "가벼운 이미지로 다시 펼치는 중이에요";
    console.warn("[viewer] SVG 대신 PNG 사용:", why);
    document.getElementById("raw").href = fallback;
    img.src = fallback;
  };
  img.onload = () => {
    if (!img.naturalWidth) return useFallback("크기 0");
    done = true; natW = img.naturalWidth; natH = img.naturalHeight;
    msg.remove(); fit();
    requestAnimationFrame(() => img.classList.add("is-ready"));
    hint.classList.remove("is-gone");
    hintTimer = setTimeout(hideHint, 5000);
  };
  img.onerror = () => useFallback("onerror");
  setTimeout(() => { if (!done) useFallback("시간 초과"); }, 12000);
  img.src = url;

  stage.addEventListener("wheel", e => {
    e.preventDefault(); hideHint();
    zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX, e.clientY);
  }, { passive: false });
  stage.addEventListener("dblclick", e => zoomAt(2, e.clientX, e.clientY));

  // 마우스 드래그 + 터치 핀치
  const pts = new Map(); let last = null;
  stage.addEventListener("pointerdown", e => {
    hideHint();
    stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
    stage.classList.add("drag"); last = null;
  });
  stage.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 1) { x += e.clientX - prev[0]; y += e.clientY - prev[1]; apply(); }
    else if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      const cx = (a[0] + b[0]) / 2, cy = (a[1] + b[1]) / 2;
      if (last) { x += cx - last.cx; y += cy - last.cy; zoomAt(d / last.d, cx, cy); }
      last = { d, cx, cy };
    }
  });
  const end = e => { pts.delete(e.pointerId); last = null; if (!pts.size) stage.classList.remove("drag"); };
  stage.addEventListener("pointerup", end); stage.addEventListener("pointercancel", end);

  const center = () => [innerWidth / 2, innerHeight / 2];
  document.getElementById("in").onclick = () => zoomAt(1.4, ...center());
  document.getElementById("out").onclick = () => zoomAt(1 / 1.4, ...center());
  document.getElementById("fit").onclick = fit;
  addEventListener("keydown", e => {
    if (e.key === "+" || e.key === "=") zoomAt(1.4, ...center());
    else if (e.key === "-") zoomAt(1 / 1.4, ...center());
    else if (e.key === "0") fit();
    else return;
    hideHint();
  });
  addEventListener("resize", () => { if (done) fit(); });
})();
</script>
</body>
</html>
