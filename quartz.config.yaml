# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: 뉴리의창고
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: ko-KR
  baseUrl: imvely.github.io/nyuri-garden
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: local
    cdnCaching: true
    typography:
      header: Gaegu
      body: Pretendard
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#fbf6ec"
        lightgray: "#ece2d0"
        gray: "#7a6a57"
        darkgray: "#43382c"
        dark: "#2b221a"
        secondary: "#a35f1f"
        tertiary: "#7d4512"
        highlight: rgba(232, 150, 60, 0.12)
        textHighlight: "#f2c46d55"
      darkMode:
        light: "#1d1915"
        lightgray: "#3a322a"
        gray: "#b3a690"
        darkgray: "#e6dccb"
        dark: "#f6eee1"
        secondary: "#d9ab72"
        tertiary: "#ecc596"
        highlight: rgba(217, 171, 114, 0.08)
        textHighlight: "#d9ab7238"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: default
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      # 메뉴 순서: 연구, 논문 노트, IT 트렌드, 강의, 아이디어, 일지 / 프로젝트 안: 허브, 계획, 실험, 결과, 개념, 첨부
      # 공개 카테고리(IT 트렌드, 논문 노트) 안: 블로그에 올라간 시각 최신순, 최근 6개 + 지금 보는 글 + '전체 n개 보기', 이름은 제목의 콜론 앞부분
      # added 는 scripts/postbuild.py 가 contentIndex.json 에 넣는다. 비공개 폴더는 손대지 않는다
      mapFn: "(node) => { const PUB = {'it-트렌드': 1, '논문-노트': 1}, N = 6; if (!node.isFolder || !PUB[node.slugSegment]) return; const files = node.children.filter((c) => !c.isFolder && c.data); const rest = node.children.filter((c) => c.isFolder || !c.data); files.sort((a, b) => String((b.data && b.data.added) || '').localeCompare(String((a.data && a.data.added) || ''))); files.forEach((c, i) => { c.nyuriOrder = i; const t = (c.data && c.data.title) || ''; const k = t.indexOf(':'); if (k > 0) c.displayName = t.slice(0, k).trim(); }); const cur = (document.body && document.body.dataset.slug) || ''; const shown = files.slice(0, N); const curNode = files.find((c) => c.data.slug === cur); if (curNode && shown.indexOf(curNode) < 0) shown.push(curNode); if (files.length > shown.length) shown.push({ isFolder: false, children: [], slugSegment: '__more', nyuriOrder: 9999, displayName: '전체 ' + files.length + '개 보기', data: { slug: node.slugSegments.join('/') + '/', title: '' }, sort() {}, filter() {}, map() {} }); node.children = shown.concat(rest); }"
      sortFn: "(a, b) => { if (a.nyuriOrder != null && b.nyuriOrder != null) return a.nyuriOrder - b.nyuriOrder; const o = {'연구': 1, '논문-노트': 2, 'it-트렌드': 3, '강의': 4, '아이디어': 5, '일지': 6, '00-허브': 1, '01-계획': 2, '실험': 3, '결과': 4, '개념': 5, '첨부': 6}; const ka = o[a.slugSegment], kb = o[b.slugSegment]; if (ka && kb) return ka - kb; if (ka) return -1; if (kb) return 1; if (a.isFolder !== b.isFolder) return a.isFolder ? -1 : 1; return (a.displayName || '').localeCompare(b.displayName || '', undefined, { numeric: true, sensitivity: 'base' }) }"
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: false
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/Imvely/nyuri-garden
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: false
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
